services:
  - type: web
    name: tele-to-vid
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python backend/bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: gemini-3.6-flash
      - key: AGENT_TIMEOUT
        value: "600"
      - key: AGENT_MAX_STEPS
        value: "10"
      - key: AGENT_REQUESTS_PER_MINUTE
        value: "4"
      - key: DAILY_JOB_LIMIT
        value: "3"
      - key: SELF_PING_SECONDS
        value: "840"
      - key: LOG_LEVEL
        value: INFO
